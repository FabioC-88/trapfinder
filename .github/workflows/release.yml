name: Release Foundry Module

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update module.json version and download URL
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          ZIP_NAME="dnd5e-gm-toolkit-${TAG}.zip"

          jq --arg v "$VERSION" \
             --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}" \
             '.version = $v | .download = $url' module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Commit updated module.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.json
          git commit -m "chore(release): ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create Zip Archive
        run: |
          ZIP_NAME="dnd5e-gm-toolkit-${GITHUB_REF_NAME}.zip"
          zip -r "$ZIP_NAME" module.json scripts tools lib lang templates styles README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            dnd5e-gm-toolkit-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
